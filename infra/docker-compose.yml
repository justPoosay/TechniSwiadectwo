services:
  db:
    image: postgres:16-alpine
    container_name: ts_postgres_db
    restart: always
    env_file:
      - ../backend/.env
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.backend
    container_name: ts_django_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../backend:/app
      # OpenAPI contract (docs/api/openapi.yaml) checked by the backend tests.
      - ../docs:/docs:ro
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - PYTHONPATH=/app
      # "backend" is the Host header sent by the Next.js /api proxy.
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.frontend
    container_name: ts_next_frontend
    restart: always
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - ../frontend/.env
    environment:
      - WATCHPACK_POLLING=true
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    driver: local
