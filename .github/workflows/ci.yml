name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend:
    name: Backend (Python & Django)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_DB: techniswiadectwo
      POSTGRES_USER: techniswiadectwo
      POSTGRES_PASSWORD: postgres_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: techniswiadectwo
          POSTGRES_USER: techniswiadectwo
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/dev.txt

      - name: Check formatting (Ruff)
        working-directory: backend
        run: ruff format --check .

      - name: Lint code (Ruff)
        working-directory: backend
        run: ruff check .

      - name: Type check (Mypy)
        working-directory: backend
        run: mypy .

      - name: Run unit tests (Pytest)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        working-directory: backend
        run: pytest

      - name: Test migrations on clean PostgreSQL database
        working-directory: backend
        run: |
          python manage.py migrate
          python manage.py makemigrations --check --dry-run

  frontend:
    name: Frontend (Next.js & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check API types match OpenAPI contract
        working-directory: frontend
        run: npm run api:types:check

      - name: Check formatting (Prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Lint code (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Type check (TypeScript)
        working-directory: frontend
        run: npm run type-check

      - name: Run unit tests (Vitest)
        working-directory: frontend
        run: npm run test

      - name: Build Next.js application
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_DB: techniswiadectwo
      POSTGRES_USER: techniswiadectwo
      POSTGRES_PASSWORD: postgres_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      # 127.0.0.1, not localhost: Node 20 may resolve localhost to ::1.
      BACKEND_URL: http://127.0.0.1:8000

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: techniswiadectwo
          POSTGRES_USER: techniswiadectwo
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements/dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r backend/requirements/dev.txt
          npm ci --prefix frontend
          cd frontend && npx playwright install --with-deps chromium

      - name: Prepare database with E2E data
        working-directory: backend
        run: |
          python manage.py migrate
          python manage.py seed_e2e

      - name: Start Django and Next.js
        run: |
          (cd backend && python manage.py runserver 127.0.0.1:8000 > ../django.log 2>&1 &)
          npm run build --prefix frontend
          (cd frontend && npx next start -p 3000 > ../next.log 2>&1 &)
          for url in http://127.0.0.1:8000/api/health/ http://localhost:3000/login; do
            timeout 60 sh -c "until curl -sf $url > /dev/null; do sleep 1; done"
          done

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            django.log
            next.log
