name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend:
    name: Backend (Python & Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: techniswiadectwo
          POSTGRES_USER: techniswiadectwo
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/dev.txt

      - name: Check formatting (Ruff)
        run: ruff format --check backend

      - name: Lint code (Ruff)
        run: ruff check backend

      - name: Type check (Mypy)
        run: mypy backend

      - name: Run unit tests (Pytest)
        run: pytest backend

      - name: Test migrations on clean PostgreSQL database
        env:
          POSTGRES_DB: techniswiadectwo
          POSTGRES_USER: techniswiadectwo
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          python backend/manage.py migrate --settings=config.settings.development
          python backend/manage.py makemigrations --check --dry-run --settings=config.settings.development

  frontend:
    name: Frontend (Next.js & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting (Prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Lint code (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Type check (TypeScript)
        working-directory: frontend
        run: npm run type-check

      - name: Run unit tests (Vitest)
        working-directory: frontend
        run: npm run test

      - name: Build Next.js application
        working-directory: frontend
        run: npm run build
