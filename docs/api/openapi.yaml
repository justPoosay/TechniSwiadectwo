openapi: 3.0.3
info:
  title: TechniŚwiadectwo API
  version: 0.1.0
  description: |
    API modułu dokumentacji szkolnej TechniŚwiadectwo (POC, wyłącznie dane fikcyjne).

    Frontend wywołuje API przez reverse proxy Next.js pod tym samym adresem (`/api/...`).

    ## Uwierzytelnianie

    1. `GET /api/auth/csrf/` ustawia cookie `csrftoken`.
    2. `POST /api/auth/login/` z nagłówkiem `X-CSRFToken: <csrftoken>` tworzy sesję (cookie `sessionid`, HttpOnly).
    3. Każde żądanie `POST`/`PUT`/`PATCH`/`DELETE` wymaga nagłówka `X-CSRFToken`. Logowanie obraca token, więc trzeba odczytać nową wartość cookie.

    Statusy: **401** = brak sesji (trzeba się zalogować), **403** = brak uprawnień albo błąd CSRF.

    ## Kontekst szkoły

    Endpointy danych szkoły wymagają nagłówka `X-School-ID` z identyfikatorem szkoły, w której użytkownik ma aktywne członkostwo (lista w `GET /api/auth/me/` → `memberships`). Bez niego lub dla obcej szkoły odpowiedź to 403.

    ## Paginacja

    Listy przyjmują `?page=<n>&page_size=<n>` (domyślnie 25, maksymalnie 100) i zwracają:

    ```json
    {"count": 123, "page": 1, "page_size": 25, "total_pages": 5, "results": []}
    ```

    Strona spoza zakresu daje 404.

    ## Filtrowanie, wyszukiwanie, sortowanie

    - filtry: parametry nazwane jak pola, np. `?action=login`;
    - wyszukiwanie tekstowe: `?search=<tekst>`;
    - sortowanie: `?ordering=created_at` (rosnąco) lub `?ordering=-created_at` (malejąco).

    Dostępne parametry są opisane przy każdym endpoincie.

    ## Format błędów

    Każdy błąd ma ten sam kształt (`ErrorResponse`):

    ```json
    {
      "code": "validation_error",
      "detail": "Popraw zaznaczone pola formularza.",
      "field_errors": {"email": ["Wprowadź poprawny adres e-mail."]}
    }
    ```

    | Status | `code` |
    | --- | --- |
    | 400 | `validation_error`, `parse_error` |
    | 401 | `not_authenticated` |
    | 403 | `permission_denied`, `csrf_failed` |
    | 404 | `not_found` |
    | 405 | `method_not_allowed` |
    | 500 | `server_error` |
    | 502 / 504 | `backend_unavailable` / `backend_timeout` (zwraca proxy Next.js) |

    `field_errors` występuje tylko przy błędach walidacji. Pola zagnieżdżone mają klucze z kropką, np. `guardians.0.phone`.
paths:
  /api/audit-logs/:
    get:
      operationId: audit_logs_list
      description: |-
        Dziennik audytu szkoły (tylko odczyt).

        **Wymagane role w szkole:** `principal`, `admin` (inne role: 403).
      parameters:
      - in: header
        name: X-School-ID
        schema:
          type: string
          format: uuid
        description: Identyfikator szkoły, w kontekście której wykonywane jest żądanie.
          Użytkownik musi mieć aktywne członkostwo w tej szkole.
        required: true
      - in: query
        name: action
        schema:
          type: string
          title: Operacja
          enum:
          - create
          - delete
          - login
          - update
        description: |-
          * `create` - Tworzenie
          * `update` - Edycja
          * `delete` - Usuwanie
          * `login` - Logowanie
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
        description: Zdarzenia od (ISO 8601)
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
        description: Zdarzenia do (ISO 8601)
      - name: ordering
        required: false
        in: query
        description: 'Sortowanie: nazwa pola rosnąco, z prefiksem `-` malejąco.'
        schema:
          type: string
          enum:
          - created_at
          - -created_at
          - action
          - -action
      - name: page
        required: false
        in: query
        description: Numer strony (od 1).
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Liczba wyników na stronie (domyślnie 25, maks. 100).
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Wyszukiwanie tekstowe (bez rozróżniania wielkości liter).
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - audit-logs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Nieprawidłowe dane (`code`: `validation_error`, szczegóły
            w `field_errors`).'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Brak zalogowanej sesji (`code`: `not_authenticated`).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Brak uprawnień (`permission_denied`) albo brak/nieprawidłowy
            token CSRF (`csrf_failed`).
  /api/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      description: |-
        Dziennik audytu szkoły (tylko odczyt).

        **Wymagane role w szkole:** `principal`, `admin` (inne role: 403).
      parameters:
      - in: header
        name: X-School-ID
        schema:
          type: string
          format: uuid
        description: Identyfikator szkoły, w kontekście której wykonywane jest żądanie.
          Użytkownik musi mieć aktywne członkostwo w tej szkole.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Wpis audytowy.
        required: true
      tags:
      - audit-logs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Brak zalogowanej sesji (`code`: `not_authenticated`).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Brak uprawnień (`permission_denied`) albo brak/nieprawidłowy
            token CSRF (`csrf_failed`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Nie znaleziono zasobu (`code`: `not_found`).'
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Ustawia cookie `csrftoken`, którego wartość należy odsyłać w nagłówku
        `X-CSRFToken` przy żądaniach POST/PUT/PATCH/DELETE.
      summary: Pobierz token CSRF
      tags:
      - auth
      security:
      - sessionAuth: []
      - {}
      responses:
        '204':
          description: Cookie `csrftoken` ustawione.
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Tworzy sesję (cookie `sessionid`, HttpOnly). Wymaga `X-CSRFToken`.
      summary: Zaloguj
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Nieprawidłowe dane (`code`: `validation_error`, szczegóły
            w `field_errors`).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Brak uprawnień (`permission_denied`) albo brak/nieprawidłowy
            token CSRF (`csrf_failed`).
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Wyloguj
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Brak zalogowanej sesji (`code`: `not_authenticated`).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Brak uprawnień (`permission_denied`) albo brak/nieprawidłowy
            token CSRF (`csrf_failed`).
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Zwraca zalogowanego użytkownika wraz z członkostwami w szkołach
        i rolami. 401 oznacza brak sesji.
      summary: Bieżący użytkownik
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Brak zalogowanej sesji (`code`: `not_authenticated`).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Brak uprawnień (`permission_denied`) albo brak/nieprawidłowy
            token CSRF (`csrf_failed`).
  /api/cohorts/:
    get:
      operationId: cohorts_list
      description: Klasy szkoły (tylko odczyt), np. do filtrowania listy uczniów.
      parameters:
      - in: header
        name: X-School-ID
        schema:
          type: string
          format: uuid
        description: Identyfikator szkoły, w kontekście której wykonywane jest żądanie.
          Użytkownik musi mieć aktywne członkostwo w tej szkole.
        required: true
      - in: query
        name: academic_year
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: 'Sortowanie: nazwa pola rosnąco, z prefiksem `-` malejąco.'
        schema:
          type: string
          enum:
          - name
          - -name
          - level
          - -level
      - name: page
        required: false
        in: query
        description: Numer strony (od 1).
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Liczba wyników na stronie (domyślnie 25, maks. 100).
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Wyszukiwanie tekstowe (bez rozróżniania wielkości liter).
        schema:
          type: string
      tags:
      - cohorts
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCohortList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Nieprawidłowe dane (`code`: `validation_error`, szczegóły
            w `field_errors`).'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Brak zalogowanej sesji (`code`: `not_authenticated`).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Brak uprawnień (`permission_denied`) albo brak/nieprawidłowy
            token CSRF (`csrf_failed`).
  /api/cohorts/{id}/:
    get:
      operationId: cohorts_retrieve
      description: Klasy szkoły (tylko odczyt), np. do filtrowania listy uczniów.
      parameters:
      - in: header
        name: X-School-ID
        schema:
          type: string
          format: uuid
        description: Identyfikator szkoły, w kontekście której wykonywane jest żądanie.
          Użytkownik musi mieć aktywne członkostwo w tej szkole.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Klasa.
        required: true
      tags:
      - cohorts
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cohort'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Brak zalogowanej sesji (`code`: `not_authenticated`).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Brak uprawnień (`permission_denied`) albo brak/nieprawidłowy
            token CSRF (`csrf_failed`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Nie znaleziono zasobu (`code`: `not_found`).'
  /api/health/:
    get:
      operationId: health_retrieve
      summary: Stan aplikacji
      tags:
      - health
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/students/:
    get:
      operationId: students_list
      description: |-
        Lista uczniów szkoły z paginacją, wyszukiwaniem i filtrowaniem.

        **Wymagane role w szkole:** `secretariat`, `principal`, `admin` (inne role: 403).
      summary: Lista uczniów
      parameters:
      - in: header
        name: X-School-ID
        schema:
          type: string
          format: uuid
        description: Identyfikator szkoły, w kontekście której wykonywane jest żądanie.
          Użytkownik musi mieć aktywne członkostwo w tej szkole.
        required: true
      - in: query
        name: academic_year
        schema:
          type: string
          format: uuid
        description: Rok szkolny klasy (UUID)
      - in: query
        name: cohort
        schema:
          type: string
          format: uuid
        description: Klasa (UUID)
      - name: ordering
        required: false
        in: query
        description: 'Sortowanie: nazwa pola rosnąco, z prefiksem `-` malejąco.'
        schema:
          type: string
          enum:
          - last_name
          - -last_name
          - first_name
          - -first_name
          - register_number
          - -register_number
          - date_of_birth
          - -date_of_birth
          - created_at
          - -created_at
      - name: page
        required: false
        in: query
        description: Numer strony (od 1).
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Liczba wyników na stronie (domyślnie 25, maks. 100).
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Wyszukiwanie tekstowe (bez rozróżniania wielkości liter).
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: Status ucznia
          enum:
          - ACTIVE
          - GRADUATED
          - WITHDRAWN
        description: |-
          Status ucznia

          * `ACTIVE` - Uczęszcza (Aktywny)
          * `GRADUATED` - Absolwent (Ukończył szkołę)
          * `WITHDRAWN` - Odszedł / Skreślony
      tags:
      - students
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudentListList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Nieprawidłowe dane (`code`: `validation_error`, szczegóły
            w `field_errors`).'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Brak zalogowanej sesji (`code`: `not_authenticated`).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Brak uprawnień (`permission_denied`) albo brak/nieprawidłowy
            token CSRF (`csrf_failed`).
  /api/students/{id}/:
    get:
      operationId: students_retrieve
      description: |-
        Szczegółowe dane ucznia wraz z historią przebiegu nauki i rejestrem korekt.

        **Wymagane role w szkole:** `secretariat`, `principal`, `admin` (inne role: 403).
      summary: Szczegóły ucznia
      parameters:
      - in: header
        name: X-School-ID
        schema:
          type: string
          format: uuid
        description: Identyfikator szkoły, w kontekście której wykonywane jest żądanie.
          Użytkownik musi mieć aktywne członkostwo w tej szkole.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Uczeń.
        required: true
      tags:
      - students
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Brak zalogowanej sesji (`code`: `not_authenticated`).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Brak uprawnień (`permission_denied`) albo brak/nieprawidłowy
            token CSRF (`csrf_failed`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Nie znaleziono zasobu (`code`: `not_found`).'
components:
  schemas:
    ActionEnum:
      enum:
      - create
      - update
      - delete
      - login
      type: string
      description: |-
        * `create` - Tworzenie
        * `update` - Edycja
        * `delete` - Usuwanie
        * `login` - Logowanie
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_email:
          type: string
          format: email
          readOnly: true
          nullable: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          title: Operacja
        target_type:
          type: string
          title: Typ obiektu
          maxLength: 100
        target_id:
          type: string
          title: Identyfikator obiektu
          maxLength: 255
        changes:
          title: Bezpieczny opis zmian
        ip_address:
          type: string
          nullable: true
          title: Adres IP
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Czas zdarzenia
      required:
      - action
      - actor_email
      - created_at
      - id
      - target_id
      - target_type
    BlankEnum:
      enum:
      - ''
    Cohort:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Nazwa Klasy
          maxLength: 10
        level:
          type: integer
          title: Poziom
        academic_year:
          type: string
          format: uuid
        academic_year_name:
          type: string
          readOnly: true
      required:
      - academic_year
      - academic_year_name
      - id
      - level
      - name
    CohortNested:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Nazwa Klasy
          maxLength: 10
        level:
          type: integer
          title: Poziom
        academic_year_name:
          type: string
          readOnly: true
      required:
      - academic_year_name
      - id
      - level
      - name
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Stabilny kod błędu, np. `validation_error`, `not_authenticated`,
            `permission_denied`, `csrf_failed`, `not_found`, `server_error`.
        detail:
          type: string
          description: Komunikat do wyświetlenia użytkownikowi.
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Błędy poszczególnych pól (tylko dla `validation_error`). Pola
            zagnieżdżone mają klucze z kropką, np. `guardians.0.phone`.
      required:
      - code
      - detail
    EventTypeEnum:
      enum:
      - ADMISSION
      - CLASS_ASSIGNMENT
      - PROMOTION
      - REPEAT
      - TRANSFER
      - GRADUATION
      - WITHDRAWAL
      type: string
      description: |-
        * `ADMISSION` - Przyjęcie do szkoły
        * `CLASS_ASSIGNMENT` - Przypisanie do klasy
        * `PROMOTION` - Promocja do następnej klasy
        * `REPEAT` - Powtarzanie klasy
        * `TRANSFER` - Przeniesienie do innej klasy
        * `GRADUATION` - Ukończenie szkoły
        * `WITHDRAWAL` - Odejście ze szkoły
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    IdDocumentTypeEnum:
      enum:
      - PASSPORT
      - ID_CARD
      - OTHER
      type: string
      description: |-
        * `PASSPORT` - Paszport
        * `ID_CARD` - Dowód osobisty
        * `OTHER` - Inny dokument tożsamości
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    Message:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    PaginatedAuditLogList:
      type: object
      required:
      - count
      - page
      - page_size
      - total_pages
      - results
      properties:
        count:
          type: integer
          example: 123
          description: Liczba wszystkich wyników.
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 25
        total_pages:
